<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff7fa" />
    <meta
      name="description"
      content="Register, review candidates, cast your vote, and view the final election results."
    />
    <title>Admin login</title>
    <link rel="stylesheet" href="../css/admin-login.css" />
    <!-- Load the wallet library and shared code before this page script. -->
    <script src="../script/vendor/ethers.umd.min.js" defer=""></script>
    <script src="../script/common.js" defer></script>
    <script src="../script/admin-login.js" defer></script>
  </head>
  <body data-page="admin-login">
    <a class="skip-link" href="#mainContent">Skip to content</a>
    <header class="site-header">
      <a class="home-mark" href="index.html" aria-label="Go to voter login"
        ><span aria-hidden="true">✓</span></a
      >
      <nav aria-label="Main navigation">
        <a href="candidates.html">Candidates</a>
        <a href="vote.html">Vote</a>
        <a href="results.html">Results</a>
        <a href="admin.html" id="adminNav" hidden="">Manage election</a>
      </nav>
      <div class="header-account">
        <span class="state-pill" id="electionStatus" hidden=""
          >Checking election…</span
        ><button class="text-button" id="logoutButton" type="button" hidden="">
          Log out</button
        ><a
          class="button button-small button-secondary"
          href="index.html"
          id="loginLink"
          >Log in</a
        >
      </div>
    </header>
    <!-- Page scripts find elements by these IDs and update their status and controls. -->
      <main id="mainContent" tabindex="-1">
      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
        hidden=""
      >
        <span id="messageText"></span>
      </div>
      <section
        id="page-admin-login"
        class="page narrow-page"
        aria-labelledby="adminLoginHeading"
      >
        <a class="back-link" href="index.html">← Back to voter login</a>
        <div class="panel auth-panel">
          <span class="section-tag">ELECTORAL ADMIN</span>
          <h1 id="adminLoginHeading" class="page-title">Manage the election</h1>
          <div class="wallet-illustration" aria-hidden="true">
            <span>✓</span>
          </div>
          <button
            id="adminLoginButton"
            class="button full"
            type="button"
            disabled=""
          >
            Log in with admin wallet <span aria-hidden="true">→</span>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
